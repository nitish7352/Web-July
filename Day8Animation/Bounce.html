<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .ball{
      width: 50px;
      height: 50px;
      background-color: red;
      border-radius: 50%;
      animation-name: bounce;
      animation-duration: 2s;
      animation-iteration-count: infinite;
    }

    /* @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(100px); }

      100% { transform: translateY(0); }
    }  */

    @keyframes bounce {
      0% { opacity: 0; background-color: red; transform: translateY(0); }
      25% { opacity: 1; background-color: yellow; transform: translateY(100px); }
      50% { opacity: 1; background-color: blue; transform: translateY(200px); }
      75% { opacity: 1; background-color: green; transform: translateY(300px); }
      100% { opacity: 0; background-color: red; transform: translateY(400px); }
    }
  </style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
