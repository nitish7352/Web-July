<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .ecom{
      height: 100vh;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      gap: 50px;
      align-items: center;
      flex-wrap: wrap;
    }


    .product {
      border: 1px solid brown;
      padding: 10px;
      text-align: center;
      width: 220px;
      height: 330px;
      border-radius: 12px;
      margin: 15px;
      box-sizing: border-box;
      box-shadow: 0px 4px 8px black;
      background-color: rgb(204, 168, 174);
    }

    div img {
      width: 100%;
      height: 180px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    div h2 {
      font-family: Arial, sans-serif;
      text-decoration: underline;
      color: brown;
      margin-bottom: 15px;
    }

    div p {
      color: white;
      font-size: 18px;
      margin-bottom: 10px;
    }
    div button {
      background-color: orange;
      border: none;
      padding: 10px;
      border-radius: 12px;
    }

    .discount {
      color: blue;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="ecom">

  <div class="product">
    <img src="https://images.pexels.com/photos/11216260/pexels-photo-11216260.jpeg" alt="Mobile">
    <h2>Mobile</h2>
    <p>Rs. 25000</p>
    <button>Buy Now <span id="logo">📍</span></button>
  </div>

  <div class="product">
    <img src="https://images.pexels.com/photos/27426618/pexels-photo-27426618.jpeg" alt="Shoes">
    <h2>Shoes</h2>
    <p>Rs. 5,000</p>
    <button>Buy Now</button>
  </div>

  <div class="product">
    <img src="https://images.pexels.com/photos/22696330/pexels-photo-22696330.jpeg" alt="Headphones">
    <h2>Headphones</h2>
    <p>Rs. 2,000</p>
    <button>Buy Now</button>
  </div>

</body>
</html>
