<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p {
      /* color: red; */
      color: rgba(255, 0, 0, 0.8);  /* This is the rgb code for red color */
      
      /* color: hsl(210, 100%, 50%);  This is the hex code for red color */


      font-family: Arial, Helvetica, sans-serif;  /* This is the font family for the text */
      font-size: 20px;  /* This is the font size for the text */

      font-style: italic;
      font-weight: bold;
      font-variant: small-caps;


      text-align: center;
      text-decoration: underline;
      text-transform: uppercase;
      line-height: 1.5;/*Space between lines of text */
      letter-spacing: 2px; /* Space between letters of text */
    } 

    div {
      /* width: 300px; */
      /* width: 50%; percentage of the parent element*/
      /*width: 100vw;  100% of the viewport width*/
      /* max-width: 800px; */
      height: 100vh;

      


      background-color: lightblue;
      background-image: url(https://images.pexels.com/photos/34519512/pexels-photo-34519512.jpeg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
</style>
</head>
<body>
  <p>This is a simple Paragraph.</p>

  <div>
    Example Div
  </div>
</body>
</html>
