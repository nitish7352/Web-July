<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //

    console.log(Math.PI)
    console.log(Math.SQRT2)

    console.log(Math.sqrt(25))

    console.log(Math.pow(2,4))

    console.log(Math.random())  //0.342432

    console.log(Math.floor(2.5))  //Remove decimal
    console.log(Math.floor(1.9)) 

    console.log(Math.ceil(2.1))  //ceil convert into Next whole number - 3
    console.log(Math.ceil(2.6))  //3

    //Math.round - 0.5 or > than 0.5 - it will convert into next number - or < 0.5 previous number

    console.log(Math.round(4.4))  //4
    console.log(Math.round(4.5))  //5
    console.log(Math.round(4.7))  //5
    
  </script>
</body>
</html>
