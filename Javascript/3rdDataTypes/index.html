<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //Datatypes - Different types of js in

    //1. String - "Text" or "Text"

    let email = "abc@gmail.com" //string

    let password = "12365" //string

       //inbuild Method - typeof(value) Help us to check Data Type
    
    console.log(typeof(email))

    console.log(typeof(password))

    //2. Numbers - +ve , -ve , decimal No.
    //Numbers should be written Directly

    let temp = 22

    console.log(typeof(temp))

    //3. Boolean - True or False

    let LoginStatus = true //Boolean

    let NetFlixSub = false  //Boolean

    console.log(typeof(LoginStatus))

    console.log(typeof(NetFlixSub))

    //4. Undefined - When You Dont assign any value

    let discount

    console.log(typeof(discount))

    //5. null - Means Nothing

    let score = null

    console.log(typeof(score))
    //Due to Bug in Js. It show dbject as output of null

    //Multiple Data

    //1.Array - Help us to store Multiple Data and It will store diff types of Data type
    // Symbol - []
    //Index No(Position No of data) Starts with 0


    let students = ["Nitish", "Ankit", "Prince", "Rajnish", 1234, true]

    console.log(students)

    console.log(students[2])
    console.log(students[4])

    //Object - Collection of Data
    //Symbol - {}
    //Key:Value Pair

    let employee1 = {
      name : "Nitish",
      email : "nkaky10@ggmail.com",
      department: "IT",
      LoginStatus:false
    }
    console.log(employee1)
    console.log(employee1.LoginStatus)
    console.log(employee1.name)

  </script>
</body>
</html>
