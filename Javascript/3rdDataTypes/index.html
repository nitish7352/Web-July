<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //Datatypes - Different types of js in

    //1. String - "Text" or "Text"

    let email = "abc@gmail.com" //string

    let password = "12365" //string

       //inbuild Method - typeof(value) Help us to check Data Type
    
    console.log(typeof(email))

    console.log(typeof(password))

    //2. Numbers - +ve , -ve , decimal No.
    //Numbers should be written Directly

    let temp = 22

    console.log(typeof(temp))

    //3. Boolean - True or False

    let LoginStatus = true //Boolean

    let NetFlixSub = false  //Boolean

    console.log(typeof(LoginStatus))

    console.log(typeof(NetFlixSub))

    //4. Undefined - When You Dont assign any value

    let discount

    console.log(typeof(discount))

    //5. null - Means Nothing

    let score = null

    console.log(typeof(score))
    //Due to Bug in Js. It show dbject as output of null

  </script>
</body>
</html>
