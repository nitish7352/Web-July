<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //Function - Help us to do specific tasks

    function Greet(){
      //Body - Instruction/Task
      console.log("Good Evening User")
    }
    Greet() //Calling the function

    //Function with Parameter (parameter/argument/Dummy Data)

    function greeting(name){
      console.log(" Good evening " + name)
    }

    greeting("Nitish")

    //Function with return

    function TotalBill(price , quantity){

      return  price * quantity    //to give Something Back

    }

    let result = TotalBill(100,2)
    console.log(result)


    //Arror Function => Logic in one single input

    let xyz =  ()=> {
      console.log("Hello guys I am Arror Function")
    }

    xyz()  //Calling the Arror function using VariableName
  </script>
</body>
</html>
