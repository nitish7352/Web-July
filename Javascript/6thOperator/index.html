<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>

    //Operators- Help us to Action on data

    //1. Arithmetic Op. - +,-,*,/,%

    console.log(10+5)

    console.log(10-5)

    console.log(10*5)

    console.log(10/5)

    //% - Remainder

    console.log(13%2)  //1
    console.log(10%5)  //0

    //Left < Right - Left Number
    console.log(2%13)  //2
    console.log(1%8)   //1

    //Assigment Op. - Help us to assign value =

    let score = 10

    score+=5

    console.log(score)

    //Relational/Comparision Operator

    console.log(12 > 3)  //True
    console.log(11 < 15)  //True

    console.log(10<=10)  //True

    console.log(10>=5)

    //== : I will Only Compare Value

    console.log(100=="100")

    //=== : I will Compare value and Data Type as well
    console.log(100 === "100")

    // Logical Op. - And , Or , !

    // And && -> When Both condition is true then output is true

    let isMember = false

    let TotalBill = 1000

    console.log(isMember && TotalBill > 500)


    //Or - || - If only one condition is true then output is true

    let LoginStatus = true

    let NetflixSub = false

    console.log(" Access to Use NetFlix ", LoginStatus || NetflixSub )

    //! - Flip/Opposite

    let paymentsStatus = false

    console.log(!paymentsStatus)




    
    







  </script>
</body>
</html>
