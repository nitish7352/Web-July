<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //Condition - It use to make decision

    // if(Condition) - If statment will only give you the output when condition is true

    let age = 21

    if(age >= 18){
      //Body of If
      console.log("Eligible to vote")

      alert("Hurry You are Eligible")
    }

    //if()- True else- False

    let balance = 400

    if(balance >= 800){
      alert("Payment Successfully")
    }else{
      alert(`Insufficient Balance ${balance} Unsuccessfull`)
    }

    // else if - Multiple condition
    let ammount = 399.99

    if(ammount >500){
      alert("Free delievery")
    }
    else if (ammount>=400 ) {
      alert ("Rs 30 Delivery charge added")
    }
    else if (ammount>=300){
      alert("Rs 50 Delivery charge added")
    }
    else{
      alert("Cannot place order less than 300")
    }

  </script>
</body>
</html>
