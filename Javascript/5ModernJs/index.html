<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let username = "John"

    console.log(" Hello guys My name is " + username + " Good evening " )

    //Modern - Template String - `` BackTick
    //Variable + Text -
    //$(VariableName/Parameter Name)

    let customername = "Nitish"

    console.log(` Hello Guys My Name is ${customername} Good evening have a nice day` )


    //setTimeout - Acts like to timer to function , 1000ms = 1sec
    setTimeout(() => {
      console.log("Hi I will run after 5 sec")
    }, 5000)

    //setInterval - Acts like to timer to function , 1000ms = 1sec
    setInterval(() => {
      console.log("After every 2 sec break I will run")
    }, 2000)


  </script>
</body>
</html>
