<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //Loop - Task Repetion

    //Condition True loop will run until condition is false loop will stop

    //print nos from 1 to 10 in console
    //console.log(1)
    //console.log(2) ... 10 times ---- Wrong Method

    //1. For Loop - (start point;end point/condition;, increment++/decrement--)  -for loop - Start point and ending
    //print number 1 to 10
    for(let i=1; i<=10; i++){
      console.log(`The Number value is: ${i}` )
    }

    //print number 10 to 1
    for(let j=10; j>=1; j--){
      console.log(`The Number value is: ${j}` )
    }

    //while - (condition true)

    let count = 1
    while(count <= 5){
      console.log("Hello I am while loop")
      count++
    }


    //do While loop
    let number = 7

    do{
      console.log("Good Evening")

    }
    while(number < 5)
  </script>
</body>
</html>
